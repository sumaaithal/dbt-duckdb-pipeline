models:
  - name: job_postings
    description: "Model that selects relevant columns from the raw job postings data."
    config:
      persist_docs:
        relation: true #both for tables and columns
        columns: true
    columns:
      - name: job_id
        description: "Unique identifier for each job posting."
      - name: job_title
        description: "Title of the job posting."
      - name: company_name
        description: "Name of the company posting the job."
      - name: job_location
        description: "Location of the job posting."
      - name: job_via
        description: "Platform or source through which the job was posted."
      - name: job_schedule_type
        description: "Type of job schedule (e.g., full-time, part-time)."
      - name: job_work_from_home
        description: "Indicates if the job allows working from home."
      - name: search_date
        description: "Date when the job posting was searched or retrieved."
      - name: search_term
        description: "Search term used to find the job posting."

  - name: jobs_per_month
    description: "Model that aggregates job postings by month."
    config:
      persist_docs:
        relation: true #both for tables and columns
        columns: true
    columns:
      - name: month
        description: "Month when the job postings were searched or retrieved."
      - name: role
        description: "Search term used to find the job postings."
      - name: postings
        description: "Count of job postings for the given month."

  - name: top_locations
    description: "top 10 locations model that identifies the top locations with the highest number of job postings."
    config:
      persist_docs:
        relation: true #both for tables and columns
        columns: true
    columns:
      - name: job_location
        description: "Location of the job postings."
      - name: postings
        description: "Count of job postings for the given location."